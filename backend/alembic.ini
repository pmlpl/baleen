# Alembic config.
# NOTE: keep this file ASCII-only -- alembic reads it with the locale encoding
# (GBK on Chinese Windows), so non-ASCII comments break `alembic` commands.
# The DB URL is NOT set here; alembic/env.py reads it from app.core.config
# (env var DATABASE_URL).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
