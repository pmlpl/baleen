[project]
name = "baleen-backend"
version = "0.1.0"
description = "baleen —— 中文优先的个人智能笔记库(后端)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "markdown-it-py>=4.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# 依赖走国内镜像:清华 PyPI(AGENTS.md §6)
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
