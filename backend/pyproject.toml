[project]
name = "baleen-backend"
version = "0.1.0"
description = "baleen —— 中文优先的个人智能笔记库(后端)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "markdown-it-py>=4.2.0",
    "python-pptx>=1.0.2",
    "pgvector>=0.5.1",
    "torch>=2.14.1",
    "sentence-transformers>=6.2.0",
    "arq>=0.28.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# 依赖走国内镜像:清华 PyPI(AGENTS.md §6)
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# torch 走 PyTorch 官方 CUDA wheel(HANDOFF §2 已拍板 GPU 版);explicit=true 只对 torch 生效
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
