<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ec" />
    <title>baleen · 智能笔记库</title>
    <!-- 思源宋体(fontsource CDN,unicode-range 分片,浏览器只下用到的字形;
            断网/CDN 不可达时回退系统宋体栈,见 styles.css 的 --font-serif) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/700.css"
    />
    <!-- 印章式 favicon:朱砂小方印 + 纸白「墨」字(此前是空 data URI 消 404,现在给真章) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b03a2e'/%3E%3Ctext x='32' y='36' font-family='Songti SC,SimSun,serif' font-size='40' font-weight='700' fill='%23fffdf8' text-anchor='middle' dominant-baseline='central'%3E%E5%A2%A8%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
