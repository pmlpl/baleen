name: CI

# 2026-11-26 落地（WorkBuddy 复评报告 P1.3，主人拍板选 GitHub Actions）：
# pytest + doc_lint + vue-tsc 三道门，基线从「本地纪律 + pre-commit」升级为远端强制门。
#
# ⚠️ pytest 摘要门（下面 grep 的 720）与 STATUS 基线同数——动了测试的批次
#    必须同步升这里和 STATUS（同一条「基线只增不降」纪律）。
# CI 与本地同口径的前提：下载 bge 模型（含图编辑 PUT 等测试真走嵌入，
# 缺模型不是 skip 是 fail，因此不能省）；embed 单测也因模型在场而全跑。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        # 与 docker-compose.yml 同镜像（pgvector 扩展 + trgm 都要）
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: baleen
          POSTGRES_PASSWORD: baleen
          POSTGRES_DB: baleen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baleen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 与 tests/api/conftest.py 同款：不预热（测试自己按需加载）；不写评测候选
      EMBED_WARMUP_ON_STARTUP: "false"
      EVAL_CAPTURE_ENABLED: "false"
      # conftest 只在「未设置」时才从根 .env.example 读——CI 显式指到工作区里的模型
      EMBEDDING_MODEL_PATH: ${{ github.workspace }}/models/bge-large-zh-v1.5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（uv.lock 冻结；torch 首次较慢，走 setup-uv 缓存）
        run: uv sync --project backend --frozen

      - name: bge 嵌入模型（actions/cache 命中则秒过）
        uses: actions/cache@v4
        with:
          path: models/bge-large-zh-v1.5
          key: bge-large-zh-v1.5

      - name: 下载 bge 模型（huggingface_hub 是 sentence-transformers 的传递依赖，不新增依赖）
        run: >-
          uv run --project backend python -c
          "from huggingface_hub import snapshot_download;
          snapshot_download('BAAI/bge-large-zh-v1.5', local_dir='models/bge-large-zh-v1.5')"

      - name: 迁移到 head（CI 是空库，API/worker 测试依赖 schema）
        working-directory: backend
        run: uv run alembic upgrade head

      - name: doc_lint（文档一致性，ERROR 必须为 0）
        run: uv run --project backend python scripts/doc_lint.py

      - name: pytest（基线强制门）
        # ⚠️ 必须在 backend/ 下跑：pyproject 的 pytest 配置是 `pythonpath = ["."]`，
        # 从仓库根跑时 "." = 仓库根 → `ModuleNotFoundError: No module named 'app'`
        # （首次 CI 实跑抓的真错，2026-11-27）。与 AGENTS §7 的本地命令同口径。
        working-directory: backend
        run: |
          uv run pytest -q 2>&1 | tee pytest-output.log
          tail -n 3 pytest-output.log
          # 摘要行与本地全量一致（模型在场，无 skip 档）；掉线此处非零退出
          grep -qE "^720 passed, 1 xfailed" pytest-output.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install（lockfile 冻结）
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: vue-tsc + vite build
        run: pnpm build
        working-directory: frontend
